name: Build corrected Nalia installer

on:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - ".github/workflows/build-corrected-installer.yml"
  workflow_dispatch:

concurrency:
  group: corrected-installer-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS
        shell: powershell
        run: |
          choco install nsis --no-progress -y

      - name: Download current public Nalia payload
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/FoxandMoss/Nalia-releases/releases/download/v0.1.0/Nalia-Windows-Installer.exe"
          curl.exe -L --fail --retry 5 --retry-delay 2 -o "$env:RUNNER_TEMP\nalia-old.exe" $url
          if ($LASTEXITCODE -ne 0) { throw "Nalia payload download failed: $LASTEXITCODE" }

      - name: Stage current Nalia files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "C:\nalia-stage"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\nalia-old.exe" -ArgumentList @("/S", "/D=$stage") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Old installer staging failed: $($p.ExitCode)" }
          Get-Process nalia,nalia-windows-host -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (!(Test-Path "$stage\nalia.exe")) { throw "Staged Nalia executable not found" }
          Remove-Item "$stage\uninstall.exe" -Force -ErrorAction SilentlyContinue

      - name: Compile radio-drive installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) { $makensis = (Get-Command makensis.exe).Source }
          & $makensis "/DSTAGEDIR=C:\nalia-stage" "installer\corrected.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis failed: $LASTEXITCODE" }
          if (!(Test-Path "Nalia_0.1.0.1_x64-setup.exe")) { throw "Corrected installer missing" }

      - name: Publish installer revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v0.1.0-installerfix1"
          if (-not (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null)) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target main --title "Nalia v0.1.0 installer fix 1" --notes "Nalia v0.1.0 payload with corrected drive-radio installer and retroactive cleanup for stale Nalia tasks, startup entries, and helpers."
          }
          New-Item -ItemType Directory -Force release-out | Out-Null
          Copy-Item "Nalia_0.1.0.1_x64-setup.exe" "release-out\Nalia-Windows-Installer.exe"
          $sha=(Get-FileHash "release-out\Nalia-Windows-Installer.exe" -Algorithm SHA256).Hash.ToLower()
          "$sha  Nalia-Windows-Installer.exe" | Set-Content "release-out\Nalia-Windows-Installer.exe.sha256" -Encoding ascii
          gh release upload $tag "release-out\Nalia-Windows-Installer.exe" "release-out\Nalia-Windows-Installer.exe.sha256" --repo $env:GITHUB_REPOSITORY --clobber
          Write-Host "Published SHA256 $sha"

